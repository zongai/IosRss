name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: ver
        run: |
          # 精确匹配 KEY = VALUE;（避免整行贪婪 sed 吃到 name = Debug）
          MARKETING=$(grep -oE 'MARKETING_VERSION = [^;]+' IosRss.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *//;s/"//g' | tr -d '[:space:]')
          BUILD=$(grep -oE 'CURRENT_PROJECT_VERSION = [^;]+' IosRss.xcodeproj/project.pbxproj | head -1 | sed 's/.*= *//;s/"//g' | tr -d '[:space:]')
          if [ -z "$MARKETING" ]; then MARKETING="0.0"; fi
          if [ -z "$BUILD" ]; then BUILD="0"; fi
          # 只保留安全字符，防止路径注入
          MARKETING=$(echo "$MARKETING" | tr -cd 'A-Za-z0-9._-')
          BUILD=$(echo "$BUILD" | tr -cd 'A-Za-z0-9._-')
          IPA_NAME="IosRss-${MARKETING}-${BUILD}.ipa"
          echo "version=${MARKETING}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "ipa_name=${IPA_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${MARKETING} (${BUILD}) → ${IPA_NAME}"

      - name: Build app (no signing)
        run: |
          xcodebuild -project IosRss.xcodeproj \
            -scheme IosRss \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r "${{ steps.ver.outputs.ipa_name }}" Payload
          ls -lh "${{ steps.ver.outputs.ipa_name }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: IosRss-ipa-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}
          path: ${{ steps.ver.outputs.ipa_name }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.ipa_name }}
          tag_name: v${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.build }}-build${{ github.run_number }}
          name: IosRss ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.build }}) #${{ github.run_number }}
          generate_release_notes: true
