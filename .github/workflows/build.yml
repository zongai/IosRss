name: Build Unsigned IPA

on:
  #push:
  #  branches: [ main ]
  #  tags:
  #    - 'v*'          # 推送 tag 时也触发,比如 v1.0.0
  workflow_dispatch:

permissions:
  contents: write        # 关键:允许创建 Release,默认是只读

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build app (no signing)
        run: |
          xcodebuild -project IosRss.xcodeproj \
            -scheme IosRss \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r IosRss.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: IosRss-ipa
          path: IosRss.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: IosRss.ipa
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          generate_release_notes: true
          
      # 方案 B(推荐):用 gh CLI,零第三方依赖,无警告
